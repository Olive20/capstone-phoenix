---
- name: Install k3s agent and join cluster
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      K3S_URL=https://{{ hostvars['server']['private_ip'] }}:6443 \
      K3S_TOKEN={{ hostvars['server']['k3s_node_token'] }} \
      sh -s - agent --node-external-ip {{ ansible_host }}
  args:
    creates: /usr/local/bin/k3s